<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrillMaster POS - Login</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Login Page Content -->
    <div id="login-overlay" style="display: flex;">
        <div class="login-box">
            <div class="logo" style="margin-bottom: 20px; color: #ea7c69; font-size: 40px;">
                <i class="fa-solid fa-burger"></i>
            </div>
            <h2>GrillMaster POS</h2>
            <p style="color: #abbbc2; margin-bottom: 30px;">Please login to continue</p>
            <form id="login-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="login-username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Login</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
