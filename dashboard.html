<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrillMaster POS - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-burger"></i>
            </div>
            <nav>
                <ul>
                    <li class="active" id="nav-home">
                        <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i></a>
                    </li>
                    <li id="nav-pos">
                        <a href="pos.html"><i class="fa-solid fa-house"></i></a>
                    </li>
                    <li id="nav-customers">
                        <a href="customers.html"><i class="fa-solid fa-users"></i></a>
                    </li>
                    <li id="nav-products">
                        <a href="products.html"><i class="fa-solid fa-box-open"></i></a>
                    </li>
                    <li id="nav-orders">
                        <a href="orders.html"><i class="fa-solid fa-clipboard-list"></i></a>
                    </li>
                    <li id="nav-users" style="display: none;">
                        <a href="users.html"><i class="fa-solid fa-user-shield"></i></a>
                    </li>
                </ul>
            </nav>
            <div class="logout" onclick="logout()">
                <a href="#"><i class="fa-solid fa-right-from-bracket"></i></a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Home/Dashboard Section -->
            <section id="home-section" class="section active" style="display: block;">
                <header>
                    <h1>Dashboard</h1>
                    <p id="dashboard-date">Overview</p>
                </header>
                <div class="dashboard-stats" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px;">
                    <div class="stat-card" style="background: #1f1d2b; padding: 20px; border-radius: 8px; text-align: center;">
                        <i class="fa-solid fa-coins" style="font-size: 24px; color: #ea7c69; margin-bottom: 10px;"></i>
                        <h3 style="margin: 0; color: #abbbc2; font-size: 14px;">Total Revenue</h3>
                        <p id="stat-revenue" style="font-size: 24px; font-weight: bold; margin: 10px 0 0;">LKR 0</p>
                    </div>
                    <div class="stat-card" style="background: #1f1d2b; padding: 20px; border-radius: 8px; text-align: center;">
                        <i class="fa-solid fa-clipboard-check" style="font-size: 24px; color: #ea7c69; margin-bottom: 10px;"></i>
                        <h3 style="margin: 0; color: #abbbc2; font-size: 14px;">Total Orders</h3>
                        <p id="stat-orders" style="font-size: 24px; font-weight: bold; margin: 10px 0 0;">0</p>
                    </div>
                    <div class="stat-card" style="background: #1f1d2b; padding: 20px; border-radius: 8px; text-align: center;">
                        <i class="fa-solid fa-users" style="font-size: 24px; color: #ea7c69; margin-bottom: 10px;"></i>
                        <h3 style="margin: 0; color: #abbbc2; font-size: 14px;">Total Customers</h3>
                        <p id="stat-customers" style="font-size: 24px; font-weight: bold; margin: 10px 0 0;">0</p>
                    </div>
                </div>

                <!-- Extended Dashboard Content -->
                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px;">
                    <!-- Recent Orders -->
                    <div style="background: #1f1d2b; padding: 20px; border-radius: 8px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <h3 style="margin: 0; color: #fff; font-size: 18px;">Recent Orders</h3>
                            <a href="orders.html" style="color: #ea7c69; text-decoration: none; font-size: 14px;">View All</a>
                        </div>
                        <table style="width: 100%; border-collapse: collapse;">
                            <thead>
                                <tr style="text-align: left; color: #abbbc2; border-bottom: 1px solid #393c49;">
                                    <th style="padding: 10px;">ID</th>
                                    <th style="padding: 10px;">Customer</th>
                                    <th style="padding: 10px;">Amount</th>
                                </tr>
                            </thead>
                            <tbody id="recent-orders-table">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Right Column -->
                    <div style="display: flex; flex-direction: column; gap: 20px;">
                        <!-- Top Selling -->
                        <div style="background: #1f1d2b; padding: 20px; border-radius: 8px;">
                            <h3 style="margin: 0 0 15px 0; color: #fff; font-size: 18px;">Top Selling Items</h3>
                            <div id="top-products-list" style="display: flex; flex-direction: column; gap: 15px;">
                                <!-- Populated by JS -->
                            </div>
                        </div>

                        <!-- Low Stock -->
                        <div style="background: #1f1d2b; padding: 20px; border-radius: 8px;">
                            <h3 style="margin: 0 0 15px 0; color: #fff; font-size: 18px;">Low Stock Alert</h3>
                            <div id="low-stock-list" style="display: flex; flex-direction: column; gap: 10px;">
                                <!-- Populated by JS -->
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
