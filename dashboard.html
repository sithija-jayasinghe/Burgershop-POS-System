<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrillMaster POS - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-page">
    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-burger"></i>
            </div>
            <nav>
                <ul>
                    <li class="active" id="nav-home">
                        <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i></a>
                    </li>
                    <li id="nav-pos">
                        <a href="pos.html"><i class="fa-solid fa-house"></i></a>
                    </li>
                    <li id="nav-customers">
                        <a href="customers.html"><i class="fa-solid fa-users"></i></a>
                    </li>
                    <li id="nav-products">
                        <a href="products.html"><i class="fa-solid fa-box-open"></i></a>
                    </li>
                    <li id="nav-orders">
                        <a href="orders.html"><i class="fa-solid fa-clipboard-list"></i></a>
                    </li>
                    <li id="nav-users" style="display: none;">
                        <a href="users.html"><i class="fa-solid fa-user-shield"></i></a>
                    </li>
                </ul>
            </nav>
            <div class="logout" onclick="logout()">
                <a href="#"><i class="fa-solid fa-right-from-bracket"></i></a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Home/Dashboard Section -->
            <section id="home-section" class="section active" style="display: block;">
                <header>
                    <h1>Dashboard</h1>
                    <p id="dashboard-date">Overview</p>
                </header>
                <div class="dashboard-stats">
                    <div class="stat-card">
                        <div class="stat-icon revenue">
                            <i class="fa-solid fa-coins"></i>
                        </div>
                        <h3 class="stat-label">Total Revenue</h3>
                        <p id="stat-revenue" class="stat-value">LKR 0</p>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon orders">
                            <i class="fa-solid fa-clipboard-check"></i>
                        </div>
                        <h3 class="stat-label">Total Orders</h3>
                        <p id="stat-orders" class="stat-value">0</p>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon customers">
                            <i class="fa-solid fa-users"></i>
                        </div>
                        <h3 class="stat-label">Total Customers</h3>
                        <p id="stat-customers" class="stat-value">0</p>
                    </div>
                </div>

                <!-- Extended Dashboard Content -->
                <div class="dashboard-grid">
                    <!-- Recent Orders -->
                    <div class="dashboard-card">
                        <div class="card-header">
                            <h3>Recent Orders</h3>
                            <a href="orders.html">View All</a>
                        </div>
                        <table class="table-modern">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Customer</th>
                                    <th>Amount</th>
                                </tr>
                            </thead>
                            <tbody id="recent-orders-table">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Right Column -->
                    <div style="display: flex; flex-direction: column; gap: 24px;">
                        <!-- Top Selling -->
                        <div class="dashboard-card">
                            <div class="card-header">
                                <h3>Top Selling Items</h3>
                            </div>
                            <div id="top-products-list">
                                <!-- Populated by JS -->
                            </div>
                        </div>

                        <!-- Low Stock -->
                        <div class="dashboard-card">
                            <div class="card-header">
                                <h3>Low Stock Alert</h3>
                            </div>
                            <div id="low-stock-list">
                                <!-- Populated by JS -->
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
