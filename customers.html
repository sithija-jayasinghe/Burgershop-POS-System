<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrillMaster POS - Customers</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-burger"></i>
            </div>
            <nav>
                <ul>
                    <li id="nav-home">
                        <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i></a>
                    </li>
                    <li id="nav-pos">
                        <a href="pos.html"><i class="fa-solid fa-house"></i></a>
                    </li>
                    <li class="active" id="nav-customers">
                        <a href="customers.html"><i class="fa-solid fa-users"></i></a>
                    </li>
                    <li id="nav-products">
                        <a href="products.html"><i class="fa-solid fa-box-open"></i></a>
                    </li>
                    <li id="nav-orders">
                        <a href="orders.html"><i class="fa-solid fa-clipboard-list"></i></a>
                    </li>
                    <li id="nav-users" style="display: none;">
                        <a href="users.html"><i class="fa-solid fa-user-shield"></i></a>
                    </li>
                </ul>
            </nav>
            <div class="logout" onclick="logout()">
                <a href="#"><i class="fa-solid fa-right-from-bracket"></i></a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Customers Section -->
            <section id="customers-section" class="section active" style="display: block;">
                <header>
                    <h1>Customer Management</h1>
                    <button class="btn-primary" onclick="openAddCustomerModal()"><i class="fa-solid fa-plus"></i> Add Customer</button>
                </header>
                <div class="table-container">
                    <table id="customer-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Email</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Customer Modal -->
    <div id="customer-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('customer-modal')">&times;</span>
            <h2 id="customer-modal-title">Add Customer</h2>
            <form id="customer-form">
                <input type="hidden" id="customer-id">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="customer-name" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="customer-phone" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="customer-email">
                </div>
                <button type="submit" class="btn-primary">Save</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
